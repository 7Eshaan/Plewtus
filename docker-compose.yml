services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Optional: reported by /health, e.g. PLEWTUS_COMMIT=$(git rev-parse --short=12 HEAD)
        COMMIT: "${PLEWTUS_COMMIT:-}"
    environment:
      PORT: "8080"
      PLEWTUS_API_KEYS: "${PLEWTUS_API_KEY:?Copy .env.example to .env and set PLEWTUS_API_KEY}:pro"
      PLEWTUS_AUTH_REQUIRED: "true"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PLEWTUS_BACKEND_URL: http://backend:8080
      PLEWTUS_API_KEY: "${PLEWTUS_API_KEY:?Copy .env.example to .env and set PLEWTUS_API_KEY}"
      PLEWTUS_RATE_LIMIT_PER_MINUTE: "${PLEWTUS_RATE_LIMIT_PER_MINUTE:-20}"
      PLEWTUS_FAVICON_RATE_LIMIT_PER_MINUTE: "${PLEWTUS_FAVICON_RATE_LIMIT_PER_MINUTE:-300}"
      PLEWTUS_TRUST_PROXY_HEADERS: "${PLEWTUS_TRUST_PROXY_HEADERS:-false}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
