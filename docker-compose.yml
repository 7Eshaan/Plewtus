services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      PLEWTUS_API_KEYS: "${PLEWTUS_API_KEY:?Copy .env.example to .env and set PLEWTUS_API_KEY}:pro"
      PLEWTUS_AUTH_REQUIRED: "true"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PLEWTUS_BACKEND_URL: http://backend:8080
      PLEWTUS_API_KEY: "${PLEWTUS_API_KEY:?Copy .env.example to .env and set PLEWTUS_API_KEY}"
      PLEWTUS_RATE_LIMIT_PER_MINUTE: "${PLEWTUS_RATE_LIMIT_PER_MINUTE:-20}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
